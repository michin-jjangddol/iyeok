<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시초점 배우기 · 아이역 iYeok</title>
  <meta name="description" content="시초 쉰 가지로 첫 효 하나가 만들어지는 과정을 나누고, 덜고, 넷씩 세며 차근차근 배워 봅니다.">
  <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="261119_2114_learn_Laude.css">
</head>
<body>
  <!-- 시초점 배우기 3차: 첫 효 하나를 끝까지 만든다. 2~6효, 실제 점치기, 음성, 설정 저장, 오프라인은 아직 없다. -->
  <header class="site-header">
    <a class="brand" href="../../" aria-label="아이역 홈">
      <span class="brand-mark">i易</span>
      <span class="brand-name">iYeok</span>
    </a>
    <nav class="site-nav" aria-label="주요 메뉴">
      <a href="../">시초점 메뉴</a>
    </nav>
  </header>

  <main class="learn">
    <p class="eyebrow">시초점 · 배우기</p>
    <h1 class="learn-heading">시초점 배우기</h1>
    <p class="learn-notice" id="notice"></p>

    <section class="learn-scene" aria-labelledby="scene-title">
      <div class="learn-head">
        <h2 id="scene-title" tabindex="-1">자리 펴기</h2>
        <span class="learn-step" id="scene-step">준비</span>
      </div>

      <div class="learn-mat">
        <div class="learn-mat-bg" style="background-image:url('261119_2027_mat_Laude.svg')" aria-hidden="true"></div>
        <svg id="field" class="learn-field" viewBox="0 0 360 240" role="img" aria-label="펼쳐 놓은 천"></svg>
      </div>

      <p class="learn-counts" id="counts" aria-live="polite" hidden></p>

      <div class="learn-story" id="story" tabindex="-1" aria-live="polite"></div>

      <button type="button" class="learn-btn learn-action" id="action" hidden>하나 따로 두기</button>
      <button type="button" class="learn-btn learn-ghost learn-toggle" id="summary-toggle" aria-pressed="false" hidden>같은 과정 요약해서 보기</button>

      <div class="learn-panel" id="split-panel" hidden>
        <label class="learn-range-label" for="split-range">왼쪽 무더기에 둘 시초 가지 수</label>
        <input type="range" id="split-range" min="1" max="47" step="1" value="24">
        <div class="learn-range-row">
          <button type="button" class="learn-btn learn-small" id="split-minus" aria-label="왼쪽 한 가지 줄이기">−1</button>
          <output class="learn-readout" id="split-readout" for="split-range">왼쪽 24 · 오른쪽 25 · 합계 49</output>
          <button type="button" class="learn-btn learn-small" id="split-plus" aria-label="왼쪽 한 가지 늘리기">+1</button>
        </div>
        <p class="learn-hint" id="split-hint">왼쪽은 1~47가지로 정할 수 있고, 오른쪽에는 언제나 두 가지 이상 남습니다.</p>
        <div class="learn-range-row">
          <button type="button" class="learn-btn learn-ghost" id="split-example">예시 따라가기</button>
          <button type="button" class="learn-btn learn-primary" id="split-confirm">이렇게 나누기</button>
        </div>
        <p class="learn-example-hint" id="split-example-hint"></p>
      </div>

      <div class="learn-board" id="board" hidden aria-label="효판">
        <p class="learn-board-title">효판 (아래에서 위로 쌓습니다)</p>
        <div class="board-line" data-line="6"><span class="board-label">상효 · 준비 중</span><span class="board-mark"></span><span class="board-bar"></span></div>
        <div class="board-line" data-line="5"><span class="board-label">5효 · 준비 중</span><span class="board-mark"></span><span class="board-bar"></span></div>
        <div class="board-line" data-line="4"><span class="board-label">4효 · 준비 중</span><span class="board-mark"></span><span class="board-bar"></span></div>
        <div class="board-line" data-line="3"><span class="board-label">3효 · 준비 중</span><span class="board-mark"></span><span class="board-bar"></span></div>
        <div class="board-line" data-line="2"><span class="board-label">2효 · 준비 중</span><span class="board-mark"></span><span class="board-bar"></span></div>
        <div class="board-line" data-line="1"><span class="board-label">초효 · 아직 그리지 않음</span><span class="board-mark"></span><span class="board-bar"></span></div>
      </div>
      <p class="learn-line-table" id="line-table" hidden></p>

      <nav class="learn-nav" aria-label="장면 이동">
        <button type="button" class="learn-btn learn-ghost" id="prev">이전</button>
        <button type="button" class="learn-btn learn-ghost" id="replay">다시 보기</button>
        <button type="button" class="learn-btn learn-primary" id="next">배우기 시작</button>
      </nav>

      <div class="learn-end" id="end-links" hidden>
        <button type="button" class="learn-btn learn-primary" id="restart">처음부터 다시 배우기</button>
        <p><a href="../">시초점 메뉴로</a> · <a href="../../">아이역 홈으로</a></p>
      </div>
    </section>

    <p class="try learn-back"><a href="../">← 시초점 메뉴로</a> · <a href="../../">아이역 홈으로</a></p>
  </main>

  <footer class="site-footer">
    <p>© 2026 iYeok Project · <a href="https://github.com/michin-jjangddol/iyeok">Source</a> · <a href="https://github.com/michin-jjangddol/iyeok/blob/main/LICENSE">AGPL-3.0</a></p>
  </footer>

  <script type="module" src="261119_2114_learn_Laude.js"></script>
</body>
</html>
